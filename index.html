<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SITTA - Pemesanan Bahan Ajar UT</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div id="app" v-cloak>
    <header class="topbar">
      <h1>SITTA <small>Pemesanan Bahan Ajar Universitas Terbuka</small></h1>
      <nav>
        <button :class="{ active: tab === 'stok' }" @click="tab = 'stok'">Stok</button>
        <button :class="{ active: tab === 'tracking' }" @click="tab = 'tracking'">Tracking DO</button>
        <button :class="{ active: tab === 'order' }" @click="tab = 'order'">Pemesanan</button>
      </nav>
    </header>

    <main class="container">
      <p v-if="loading" class="muted">Memuat data...</p>
      <p v-else-if="loadError" class="error-text">{{ loadError }}</p>

      <template v-else>
        <section v-show="tab === 'stok'">
          <ba-stock-table
            :items="state.stok"
            :upbjj-list="state.upbjjList"
            :kategori-list="state.kategoriList"
            @create="handleCreateStok"
            @update="handleUpdateStok"
            @delete="handleDeleteStok"></ba-stock-table>
        </section>

        <section v-show="tab === 'tracking'">
          <do-tracking
            :data="state.tracking"
            :paket="state.paket"
            @add-progress="handleAddProgress"></do-tracking>
        </section>

        <section v-show="tab === 'order'">
          <order-form
            :paket="state.paket"
            :ekspedisi="state.pengirimanList"
            :next-number="nextDONumber"
            @created="handleNewDO"></order-form>
        </section>
      </template>
    </main>

    <app-modal ref="modal"></app-modal>
  </div>

  <!-- Templates dimuat dari folder /templates oleh app.js (lihat api.loadTemplates) -->

  <!-- Scripts (urutan penting) -->
  <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
  <script src="js/services/api.js"></script>
  <script src="js/components/status-badge.js"></script>
  <script src="js/components/app-modal.js"></script>
  <script src="js/components/stock-table.js"></script>
  <script src="js/components/do-tracking.js"></script>
  <script src="js/components/order-form.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
